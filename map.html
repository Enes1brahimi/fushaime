<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07180f">
    <title>Football close to home | FushaIme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="map.css">
  </head>
  <body>
    <main class="location-page">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-content">
          <p class="eyebrow">Within Vushtrri Municipality</p>
          <h1 id="page-title">Football,<br>close<br><span>to home.</span></h1>
          <p class="description">The directory is limited to Vushtrri and localities enabled by the platform administrator. Map locations are displayed only after platform verification.</p>
          <ul class="legend" aria-label="Map location status">
            <li><span class="legend-dot legend-dot--verified" aria-hidden="true"></span>Platform-verified coordinates</li>
            <li><span class="legend-dot legend-dot--owner" aria-hidden="true"></span>Owner-provided, not pinned</li>
          </ul>
        </div>
      </section>

      <section class="map-panel" aria-label="Map of Vushtrri, Kosovo">
        <iframe
          title="Interactive map centered on Vushtrri, Kosovo"
          src="https://maps.google.com/maps?q=Vushtrri%2C%20Kosovo&amp;z=12&amp;output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </section>
    </main>
  </body>
</html>
